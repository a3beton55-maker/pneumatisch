    var top = all.filter(function(c){ return m3of(c) > 0; }).sort(function(a, b){ return m3of(b) - m3of(a); }).slice(0, 5);
    if (top.length) h += '<div class="sec">Top 5 · grösste Mengen</div><div class="gl">' + top.map(function(c){ return grow(c, c._t.kurz); }).join('') + '</div>';
    if (!all.length) h += '<div class="gl"><div class="gr2" style="justify-content:center;color:var(--mut)">Keine kommenden Baustellen eingetragen.</div></div>';
    (D.tage || []).forEach(function(t){
      if (!t.karten.length) return;
      var cs = t.karten.slice().sort(function(a, b){ return (a.start || '99').localeCompare(b.start || '99') || (a.p + '').localeCompare(b.p + '', 'de', {numeric: true}); });
      var s3 = 0; cs.forEach(function(c){ s3 += m3of(c); });
      h += '<div class="sec">' + esc(t.tag) + ' <span class="sm">· ' + cs.length + (cs.length === 1 ? ' Baustelle' : ' Baustellen') + ' · ' + fmt(s3) + ' m³</span></div><div class="gl">' + cs.map(function(c){ return grow(c, ''); }).join('') + '</div>';
    });
    h += '<div class="foot">Stand: ' + esc(D.stand || '') + '</div>';
    document.getElementById('app').innerHTML = h;
  }

  var cards = D.karten.slice().sort(function(a, b){ return (a.start || '99').localeCompare(b.start || '99') || (a.p + '').localeCompare(b.p + '', 'de', {numeric: true}); });
  var teams = [], tmap = {}, total = 0;
  cards.forEach(function(c){
    var id = tid(c); if (!(id in tmap)) { tmap[id] = teams.length; teams.push({id: id, p: c.p, n: [], cs: []}); }
    var T = teams[tmap[id]]; T.cs.push(c); names(c.team).forEach(function(n){ if (T.n.indexOf(n) < 0) T.n.push(n); });
    c.f.forEach(function(f){ total += num(f.m3); });
  });
  teams.forEach(function(t){
    t.hint = [];
    if (t.cs.length > 1) t.n.forEach(function(n){
      var bei = t.cs.filter(function(c){ return names(c.team).indexOf(n) >= 0; });
      if (bei.length < t.cs.length) t.hint.push(n + ' nur ' + bei.map(function(c){ return ort(c.bst); }).join(', '));
    });
  });
  teams.sort(function(a, b){ return (a.p + '').localeCompare(b.p + '', 'de', {numeric: true}); });
  var sel = ld('dispo_team') || '';
  if (sel && !(sel in tmap)) sel = '';

  document.getElementById('hd').textContent = D.tag || D.datum;
  document.getElementById('hs').innerHTML = '<span>' + cards.length + ' Baustellen</span>';

  function item(k, z, main, sub, light){
    var ok = ld(k) === '1';
    return '<label class="it' + (ok ? ' ok' : '') + '"><input type="checkbox" data-k="' + k + '"' + (ok ? ' checked' : '') + '><span class="ck">' + IC.ok + '</span><span class="z">' + esc(z) + '</span><span class="tx"><span class="mn' + (light ? ' l' : '') + '">' + main + '</span>' + (sub ? '<span class="sb">' + sub + '</span>' : '') + '</span></label>';
  }

  function card(c){
    var CK = KEY + hash(c.bst + '|' + c.p + '|' + c.start) + '|';
    var keys = [], ev = [], idx = 0;
    c.f.forEach(function(f){ ev.push({z: f.z, o: 0, i: idx++, k: CK + hash('f|' + JSON.stringify(f)),
      main: esc([f.w, f.m].filter(Boolean).join(' ')) + (f.m3 ? ' · ' + esc(f.m3) + ' m³' : '') + (f.ca ? '<span class="tg">' + esc(f.ca) + '</span>' : '') + (f.o ? '<span class="ob">' + esc(f.o) + '</span>' : ''),
      sub: esc(f.h), a3: !!f.a3, mat: true, ob: String(f.o || '').trim()}); });
    c.a.forEach(function(a){ ev.push({z: a.z, o: 1, i: idx++, k: CK + hash('a|' + JSON.stringify(a)), main: esc(a.t), sub: '', a3: false, mat: false, ob: ''}); });
    ev.sort(function(a, b){ var x = mins(a.z), y = mins(b.z);
      if (x == null && y == null) return a.o - b.o || a.i - b.i;
      if (x == null) return 1; if (y == null) return -1;
      return x - y || a.o - b.o || a.i - b.i; });
    var obs = []; ev.forEach(function(e){ if (e.ob && obs.indexOf(e.ob) < 0) obs.push(e.ob); });
    var grp = obs.length >= 2;
    if (grp) { var ord = obs.concat(['']); ev.sort(function(a, b){ return ord.indexOf(a.ob) - ord.indexOf(b.ob); }); }
    var body = '<div class="tl">', last = null;
    ev.forEach(function(e){
      if (grp && e.ob !== last) { body += '<div class="og">' + (e.ob ? esc(e.ob) : 'Allgemein') + '</div>'; last = e.ob; }
      keys.push(e.k); var ok = ld(e.k) === '1';
      if (grp && e.ob) e.main = e.main.replace('<span class="ob">' + esc(e.ob) + '</span>', '');
      body += '<label class="ts' + (ok ? ' ok' : '') + (e.mat ? '' : ' w') + '"><input type="checkbox" data-k="' + e.k + '"' + (ok ? ' checked' : '') + '><span class="dot"></span>';
      body += '<span class="sx"><span class="sl"><span class="tm">' + (e.z ? esc(e.z) : 'danach') + '</span> <span class="mn">' + e.main + '</span>' + (e.sub ? '<span class="sb">' + e.sub + '</span>' : '') + '</span>' + (e.a3 ? '<span class="a3">a3</span>' : '') + '</span></label>';
    });
    body += '</div>';
    var done = keys.filter(function(k){ return ld(k) === '1'; }).length;
    var all = keys.length > 0 && done === keys.length;
    var w = c.n.filter(function(t){ return t.charAt(0) === '!'; }), n = c.n.filter(function(t){ return t.charAt(0) !== '!'; });
    var h = '<div class="card' + (all ? ' done' : '') + '"><div class="c1"><span class="time">' + esc(c.start || '–') + (c.ende ? '–' + esc(c.ende) : '') + '</span>';
    h += '<span class="kd">' + esc(c.kunde || c.bst) + '</span></div>';
    h += '<div class="c2"><span class="ad">' + esc(c.bst) + '</span>' + (c.bst ? '<a class="act" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.bst) + '">' + IC.pin + ' Route</a>' : '') + tels(c.tel) + '</div>';
    if (w.length) h += '<div class="warn">' + w.map(function(t){ return '<div>' + IC.al + ' ' + esc(t.slice(1).trim()) + '</div>'; }).join('') + '</div>';
    if (n.length) h += '<div class="hint">' + n.map(function(t){ return esc(t); }).join(' · ') + '</div>';
    h += body;
    if (keys.length) h += '<div class="cf"><span class="cnt">' + (all ? '✓ erledigt' : done + ' von ' + keys.length + ' erledigt') + '</span>' + (done ? '<button class="rs" data-r="' + CK + '">' + IC.rs + ' Zurücksetzen</button>' : '') + '</div>';
    return {h: h + '</div>', done: done, n: keys.length};
  }

  function mins(t){ var m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; }
  function ort(b){ var m = /\b\d{4}\s+(.+)$/.exec(String(b || '').trim()); return m ? m[1] : String(b || ''); }
  var auf = {};
  function render(){
    var open = teams.filter(function(t){ return auf[t.id]; })[0];
    var h = '';
    if (!open) {
      var IN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';
      var TR = '<svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>';
      var info = '';
      (D.info || []).forEach(function(p){ info += '<div class="ir2">' + (p.l === 'Werkstatt' ? '<span class="lk">Werkstatt</span>' : '') + '<span>' + esc(p.v) + '</span></div>'; });
      var weg = [];
      (D.abw || []).forEach(function(a){ names(a.v).forEach(function(n){ weg.push(n.toLowerCase()); }); });
      if (D.abw && D.abw.length) info += '<div class="ir2"><span class="lk">Abwesend</span><span>' + D.abw.map(function(a){ return esc(a.v) + ' <small>(' + esc(a.l) + ')</small>'; }).join(' · ') + '</span></div>';
      var im = []; cards.forEach(function(c){ names(c.team).forEach(function(n){ im.push(n.toLowerCase()); }); });
      var frei = (D.leute || []).filter(function(n){ var k = String(n).toLowerCase(); return im.indexOf(k) < 0 && weg.indexOf(k) < 0; });
      if (info) h += '<div class="ib2"><div class="ibh">' + IN + ' Info</div>' + info + '</div>';
      if (D.laden && D.laden.length) h += '<div class="ib mb"><div class="ibh">' + TR + ' Für morgen laden</div>' + D.laden.map(function(l){ return '<div class="mr">' + (l.p ? '<span class="mp">P' + esc(l.p) + '</span>' : '') + '<span>' + esc(l.t) + '</span></div>'; }).join('') + '</div>';
      h += '<div class="sec">Einteilung</div>';
    } else {
      h += '<button class="back" data-t="' + esc(open.id) + '">' + IC.bk + ' Alle Pumpen</button>';
    }
    teams.forEach(function(t){
      if (open && open !== t) return;
      var cs = t.cs.map(card);
      var d = 0, n = 0; cs.forEach(function(x){ d += x.done; n += x.n; });
      var op = !!auf[t.id], fertig = n && d === n;
      h += '<section class="team' + (op ? ' op' : '') + '"><button class="th" data-t="' + esc(t.id) + '"><span class="pp">P' + esc(t.p) + '</span><span class="tt"><div class="nm">' + esc(t.n.join(' · ') || '–') + '</div>' + (t.hint.length ? '<div class="hns">' + t.hint.map(function(x){ return '<span class="hn">' + esc(x) + '</span>'; }).join('') + '</div>' : '');
      h += '<div class="or">' + t.cs.map(function(c){ return '<b>' + esc(c.start || '') + '</b>' + esc(ort(c.bst)); }).join(' &nbsp;·&nbsp; ') + '</div>';
      h += '<div class="st' + (fertig ? ' ok' : '') + '">' + (n ? (fertig ? '✓ alles erledigt' : d + ' von ' + n + ' erledigt') : '') + '</div>';
      if (n) h += '<div class="tb"><i style="width:' + Math.round(d / n * 100) + '%"></i></div>';
      h += '</span><span class="chev">' + IC.ch + '</span></button>';
      var ld = (D.laden || []).filter(function(l){ return String(l.p) === String(t.p); });
      h += '<div class="list">' + cs.map(function(x){ return x.h; }).join('') + (ld.length ? '<div class="lbox"><b>Für morgen laden</b>' + ld.map(function(l){ return '<div>' + esc(l.t) + '</div>'; }).join('') + '</div>' : '') + '</div></section>';
    });
    if (!open) h += '<div class="arc"><span>Archiv</span><input type="date" id="arch"><button onclick="var d=document.getElementById(\'arch\').value;if(d)location.href=\'' + WEB + 'archiv/\'+d+\'.html\';else alert(\'Bitte Datum wählen\')">Öffnen</button></div>';
    document.getElementById('app').innerHTML = h;
  }

  document.addEventListener('change', function(e){
    var el = e.target; if (!el.dataset || !el.dataset.k) return;
    sv(el.dataset.k, el.checked ? '1' : null);
    var y = window.scrollY; render(); window.scrollTo(0, y);
  });
  document.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-t],[data-r]') : null; if (!el) return;
    if (el.hasAttribute('data-t')) {
      var v = el.getAttribute('data-t'); var war = !!auf[v]; auf = {}; if (!war) auf[v] = 1;
      render(); window.scrollTo(0, 0);
    } else if (confirm('Häkchen für diese Baustelle zurücksetzen?')) {
      var pre = el.getAttribute('data-r');
      try { Object.keys(localStorage).forEach(function(k){ if (k.indexOf(pre) === 0) localStorage.removeItem(k); }); } catch(x) {}
      var y = window.scrollY; render(); window.scrollTo(0, y);
    }
  });
  render();
})();
</script>
</body>
</html>
